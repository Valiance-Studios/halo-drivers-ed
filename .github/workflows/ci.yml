name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Type-checks, then builds the web app (without Firebase config, which only a deploy needs) and the API bundle.
      - run: npm run build

      - run: npm run test:unit

  integration-tests:
    name: Database and E2E tests (Postgres, Auth emulator)
    runs-on: ubuntu-latest
    services:
      # Matches docker-compose.yml.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hde
          POSTGRES_PASSWORD: hde
          POSTGRES_DB: halo_drivers_ed
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hde -d halo_drivers_ed"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:db

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
